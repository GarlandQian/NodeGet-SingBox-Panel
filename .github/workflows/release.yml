name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify protocol generation
        run: bun run test

      - name: Build extension package
        run: bun run package

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Changes

          - Enables native XHTTP TCP multiplexing (XMUX) for VLESS + XHTTP + REALITY over HTTP/2, using stream-one.
          - Includes extra.xmux in VLESS share URIs and matching xhttp-opts.reuse-settings in Mihomo YAML, with a three-connection pool and a configured reuse window of 1800-3000 seconds.
          - Shows TCP multiplexing in the panel and validates that generated URIs retain the complete reuse settings.

          ## Upgrade

          Update the panel, then copy and reimport the URI or export Mihomo YAML. Existing XHTTP inbounds do not need redeployment. The connection remains direct REALITY with no upload/download separation.

          ## Verification

          Protocol and deployment regressions and the production package build passed. Local tests with Xray v26.10.21 and Mihomo v1.19.33 verified both URI and YAML imports over IPv4/IPv6, TCP and UDP, and 12 concurrent requests sharing an established pool of three TCP connections without additional dials.

          The pool size is not a hard cap on all TCP connections during initial dialing or rotation. Live tests used local loopback fixtures; production network performance and Linux service management were not tested on a real node.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

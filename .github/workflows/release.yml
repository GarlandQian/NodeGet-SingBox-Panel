name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify protocol generation
        run: bun run test

      - name: Build extension package
        run: bun run package

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Changed

          - Generates VLESS Reality keypairs locally in the dashboard.
          - Avoids remote `sing-box generate reality-keypair` execution during inbound creation.
          - Fixes keypair generation failures after NodeGet 0.5.18 execute task timeout changes.
          - Installs the official musl binary on Alpine instead of the incompatible release `.apk` path.
          - Fixes VMess QUIC/TLS, Shadowsocks 2022 key sizes, transport URIs, and missing outbound fields.
          - Preserves existing sing-box DNS, outbound, route, experimental, and service settings.
          - Validates and backs up configuration before atomic deployment, with rollback on restart failure.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

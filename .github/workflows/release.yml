name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify protocol generation
        run: bun run test

      - name: Build extension package
        run: bun run package

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Fixed

          - Fixes XHTTP installation preflight by using config.stage.json, a filename accepted by the pinned Xray v26.10.21 loader.
          - Separates NodeGet task delivery, process exit status, and operation postconditions to prevent false deployment success.
          - Requires request-correlated completion receipts, valid version/configuration digests, and operation-specific service state before updating the panel.
          - Preserves child-script cleanup and rollback traps, and shows redacted diagnostics without saving configuration credentials to browser history.
          - Adds production-staging and lifecycle regression checks, including rejection of the old .stage path, invalid configurations, truncated results, stopped-service updates, and rollback.

          The staging checks were also run locally with real Xray v26.10.21; URI/YAML IPv4/IPv6 TCP/UDP interoperability was reverified with Mihomo v1.19.33. Linux service management was simulated, not tested on a production node.

          Initial XHTTP scope: direct connections and direct egress only; no next-hop, CDN/reverse proxy, split download, certificate TLS, or HTTP/3 support.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify protocol generation
        run: bun run test

      - name: Build extension package
        run: bun run package

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Changed

          - Adds optional isolated Xray management for VLESS + XHTTP + REALITY over HTTP/2 in stream-one mode.
          - Exports VLESS URIs and Mihomo YAML with the required REALITY key-exchange compatibility option.
          - Uses Xray v26.10.21 and Mihomo v1.19.33 as the verified interoperability baseline; keeps existing sing-box nodes unchanged.
          - Separates service controls, state, configuration checks, version updates, and rollback by core.
          - Verifies engine isolation, port conflicts, revision checks, file permissions, service ownership, and failed-deployment rollback.

          Initial XHTTP scope: direct connections and direct egress only; no next-hop, CDN/reverse proxy, split download, certificate TLS, or HTTP/3 support.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/nodeget-singbox-panel-v${version}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
